<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>命理乾坤 · 紫微斗数</title>
<link rel="stylesheet" href="mingli-shared.css">
<style>
  /* ============================================================
     紫微斗数页 — 专属样式 (Ziwei Page-Specific Styles)
     共享样式参见: mingli-shared.css
     ============================================================ */

  /* ---- 结果区宽度 (紫微需要更宽) ---- */
  .result-section { max-width: 1100px; }

  /* ---- 命盘总览 ---- */
  .overview-card { background: var(--bg-card); border: 1px solid var(--gold); border-radius: 10px; padding: 20px 24px; margin-bottom: 24px; position: relative; }
  .overview-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); }
  .overview-card h3 { color: var(--gold); font-size: 1.05em; letter-spacing: 3px; margin-bottom: 14px; }
  .overview-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .overview-item { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; text-align: center; }
  .overview-item .label { font-size: 0.76em; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 4px; }
  .overview-item .value { font-size: 1.15em; color: var(--gold); font-weight: bold; }

  /* ---- 十二宫网格 ---- */

  .palace-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, auto); gap: 6px; }
  .palace-cell { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; min-height: 80px; }
  .palace-cell:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(201,168,76,0.15); }
  .palace-cell.ming { border-color: var(--red-light); }
  .palace-cell.ming::before { content: '命'; position: absolute; top: 4px; right: 6px; font-size: 0.6em; color: var(--red-light); background: rgba(231,76,60,0.12); padding: 1px 5px; border-radius: 6px; }
  .palace-cell.shen { border-color: var(--purple); }
  .palace-cell.shen::after { content: '身'; position: absolute; top: 4px; right: 6px; font-size: 0.6em; color: var(--purple); background: rgba(155,89,182,0.12); padding: 1px 5px; border-radius: 6px; }

  .palace-cell.center:hover { transform: none; box-shadow: none; border-color: var(--border); }

  .palace-gz { font-size: 0.68em; color: var(--text-dim); margin-bottom: 4px; }

  .mw-tag { font-size: 0.7em; vertical-align: super; margin-left: 1px; border-radius: 2px; padding: 0 2px; }
  .mw-good { color: var(--green); }
  .mw-mid { color: var(--gold); }
  .mw-bad { color: var(--red-light); }
  .p-good .fh-star { color: var(--green); }
  .p-warn .fh-star { color: var(--gold); }
  .p-info .fh-star { color: var(--text); }
  .palace-sihua { font-size: 0.65em; display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 3px; }
  .sihua-tag { padding: 1px 5px; border-radius: 4px; font-size: 0.95em; }
  .sihua-lu { background: rgba(39,174,96,0.15); color: var(--green); }
  .sihua-quan { background: rgba(41,128,185,0.15); color: var(--blue); }
  .sihua-ke { background: rgba(201,168,76,0.15); color: var(--gold); }

  /* ---- 宫位详情浮窗 ---- */

  .palace-detail .close-btn { position: absolute; top: 10px; right: 14px; background: none; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; width: 26px; height: 26px; border-radius: 50%; font-size: 0.85em; line-height: 24px; text-align: center; transition: all 0.3s; }
  .palace-detail .close-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ---- 大运卡片 ---- */

  .dayun-section h3 { color: var(--gold); font-size: 1em; letter-spacing: 3px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

  .score-bar-val { width: 26px; text-align: right; flex-shrink: 0; font-weight: bold; margin-left: 4px; }
  .bar-wealth .score-bar-fill { background: linear-gradient(90deg, #27ae60, #2ecc71); }

  .ln-mini-table td { padding: 2px 4px; border-bottom: 1px solid rgba(42,53,80,0.25); white-space: nowrap; }
  .ln-mini-table .ln-yr { color: var(--gold); font-weight: bold; }

  .ln-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  /* 四化标签行 P2 */

  .ln-sihua-badge { padding: 1px 5px; border-radius: 3px; font-size: 0.55em; font-weight: bold; letter-spacing: 0.5px; }
  .ln-card-year { font-size: 0.85em; font-weight: bold; color: var(--gold); }
  .ln-card-gz { font-size: 0.72em; color: var(--text-dim); }

<script>
// ============================================================
// 紫微斗数页 — 前端逻辑 (Ziwei Frontend Logic)
// ============================================================

// ---- 全局状态 ----
var _syncedBirth = null;
var currentSex = '男';
var currentResult = null;
var currentBirthYear = 1987;  // P5: 用于流年筛选
var activeDetailIdx = -1;

// 页面加载时检查是否有八字页同步的生辰信息
(function initSync() {
  try {
    var raw = localStorage.getItem('mingli_birth');
    if (raw) {
      _syncedBirth = JSON.parse(raw);
      // 判断是否24小时内同步的
      var savedAt = _syncedBirth.savedAt ? new Date(_syncedBirth.savedAt) : null;
      var now = new Date();
      if (savedAt && (now - savedAt) < 24 * 3600 * 1000) {
        showSyncBanner();
      }
    }
  } catch(e) {}
})();

// 页面加载时恢复上次分析结果（切页不回空白）
// 缓存版本：评分维度从4维升级到5维时必须清除旧缓存
var ZIWEI_CACHE_VERSION = 'v7.3';
(function restoreResult() {
  try {
    var ver = localStorage.getItem('mingli_ziwei_ver');
    if (ver !== ZIWEI_CACHE_VERSION) {
      localStorage.removeItem('mingli_ziwei_result');
      localStorage.setItem('mingli_ziwei_ver', ZIWEI_CACHE_VERSION);
      return;
    }
    var raw = localStorage.getItem('mingli_ziwei_result');
    if (!raw) return;
    var cached = JSON.parse(raw);
    if (!cached.result) return;
    currentResult = cached.result;
    if (cached.year) document.getElementById('year').value = cached.year;
    if (cached.month) document.getElementById('month').value = cached.month;
    if (cached.day) document.getElementById('day').value = cached.day;
    if (cached.hour) document.getElementById('hour').value = cached.hour;
    if (cached.sex) {
      currentSex = cached.sex;
      document.querySelectorAll('.sex-btn').forEach(function(b) {
        b.className = 'sex-btn';
        if ((b.textContent.indexOf('男') >= 0 && cached.sex === '男') ||
            (b.textContent.indexOf('女') >= 0 && cached.sex === '女')) {
          b.classList.add(cached.sex === '男' ? 'active-male' : 'active-female');
        }
      });
    }
    activeDetailIdx = -1;
    renderResult(cached.result);
  } catch(e) {}
})();

function showSyncBanner() {
  if (!_syncedBirth) return;
  var card = document.getElementById('syncCard');
  var detail = document.getElementById('syncDetail');
  var sexText = _syncedBirth.sex || '男';
  var bpStr = _syncedBirth.birthplace ? ' · 出生地：<strong>' + _syncedBirth.birthplace + '</strong>' : '';
  var solarLine = '';
  if (_syncedBirth.solarHour > 0 && _syncedBirth.birthplace) {
    // 展示真太阳时信息：原始公历时间 + 调整后时辰 + 经度偏移
    var rawTimeStr = _syncedBirth.solarHour + ':' + String(_syncedBirth.solarMinute||0).padStart(2,'0') + ' ' + (_syncedBirth.ampm||'AM');
    solarLine = '<br>☀ 真太阳时 ' + String(_syncedBirth.hour).padStart(2,'0') + ':' + String(_syncedBirth.minute||0).padStart(2,'0') + '（公历 ' + rawTimeStr + '）';
  }
  detail.innerHTML = '<strong>' + _syncedBirth.year + '</strong>年<strong>' + _syncedBirth.month + '</strong>月<strong>' + _syncedBirth.day + '</strong>日 ' + timeLabel(_syncedBirth.hour, _syncedBirth.minute) + ' · <strong>' + sexText + '</strong>命' + bpStr + solarLine;
  card.classList.add('show');
}

function timeLabel(h, m) {
  var labels = ['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];
  var ranges = ['(23-01)','(01-03)','(03-05)','(05-07)','(07-09)','(09-11)','(11-13)','(13-15)','(15-17)','(17-19)','(19-21)','(21-23)'];
  var idx = Math.floor(((+h) % 24) / 2);
  if (idx < 0 || idx > 11) idx = 0;
  var minStr = m ? ':' + String(m).padStart(2,'0') : ':00';
  return labels[idx] + ' ' + h + minStr + ranges[idx];
}

function useSyncedBirth() {
  if (!_syncedBirth) return;
  document.getElementById('year').value = _syncedBirth.year;
  document.getElementById('month').value = _syncedBirth.month;
  document.getElementById('day').value = _syncedBirth.day;
  // 将精确小时映射到十二时辰值（八字页真太阳时可能产出精确小时）
  var rawHour = _syncedBirth.hour;
  var shichen = rawHour;
  if (rawHour === 23 || rawHour === 0) shichen = 0;
  else if (rawHour % 2 === 0) shichen = rawHour - 1;
  document.getElementById('hour').value = shichen;
  currentSex = _syncedBirth.sex || '男';
  // 更新性别按钮状态
  document.querySelectorAll('.sex-btn').forEach(function(b) {
    b.className = 'sex-btn';
    if ((b.textContent.indexOf('男') >= 0 && currentSex === '男') ||
        (b.textContent.indexOf('女') >= 0 && currentSex === '女')) {
      b.classList.add(currentSex === '男' ? 'active-male' : 'active-female');
    }
  });
  doAnalyze();
}

function clearSyncedBirth() {
  try { localStorage.removeItem('mingli_birth'); } catch(e) {}
  _syncedBirth = null;
  document.getElementById('syncCard').classList.remove('show');
}

// ===== LLM 结果持久缓存 =====
function _cacheKey(y,m,d,h,s) { return 'ziwei_llm_v3_' + [y,m,d,h,s].join('_'); }
function _loadCache(y,m,d,h,s) {
  try { return JSON.parse(localStorage.getItem(_cacheKey(y,m,d,h,s))||'null'); } catch(e) { return null; }
}
function _saveCache(y,m,d,h,s, data) {
  // localStorage 总量检查 — 超过 2MB 清理旧缓存(保留最近5条)
  try {
    var total = 0, keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('ziwei_llm_') === 0) { total += localStorage.getItem(k).length; keys.push(k); }
    }
    if (total > 2 * 1024 * 1024 && keys.length > 5) {
      keys.sort(); // 按key名排序(ziwei_llm_v2_1987_...)，先删旧
      for (var j = 0; j < keys.length - 5; j++) localStorage.removeItem(keys[j]);
    }
  } catch(e) {}
  // 只保存LLM相关字段
  var slim = {};
  if (data['命盘总结']) slim.summary = data['命盘总结'];
  if (data['大运']) slim.dayun = data['大运'].map(function(d){return{起始年龄:d['起始年龄'],综合解读:d['综合解读']||''}});
  if (data['流年']) slim.liunian = data['流年'].map(function(l){return{年份:l['年份'],简评:l['简评']||'',简评详情:l['简评详情']||''}});
  try { localStorage.setItem(_cacheKey(y,m,d,h,s), JSON.stringify(slim)); } catch(e) {}
}
function _mergeCache(data, cache) {
  if (!cache) return;
  if (cache.summary && !data['命盘总结']) data['命盘总结'] = cache.summary;
  if (cache.dayun) {
    var dm = {}; cache.dayun.forEach(function(d){dm[d['起始年龄']]=d;});
    (data['大运']||[]).forEach(function(d){var c=dm[d['起始年龄']];if(c&&c['综合解读']&&!d['综合解读'])d['综合解读']=c['综合解读']});
  }
  if (cache.liunian) {
    var lm = {}; cache.liunian.forEach(function(l){lm[l['年份']]=l;});
    (data['流年']||[]).forEach(function(l){var c=lm[l['年份']];if(c){if(c['简评']&&!l['简评'])l['简评']=c['简评'];if(c['简评详情']&&!l['简评详情'])l['简评详情']=c['简评详情']}});
  }
}

function setSex(sex, btn) {
  currentSex = sex;
  document.querySelectorAll('.sex-btn').forEach(function(b) { b.className = 'sex-btn'; });
  btn.classList.add(sex === '男' ? 'active-male' : 'active-female');
}

function doAnalyze() {
  var year  = document.getElementById('year').value;
  var month = document.getElementById('month').value;
  var day   = document.getElementById('day').value;
  var hour  = document.getElementById('hour').value;

  if (!year || !month || !day) { alert('请填写完整的出生日期'); return; }

  var btn = document.getElementById('btnAnalyze');
  btn.disabled = true;
  document.getElementById('loading').classList.add('show');
  document.getElementById('loadingStages').style.display = 'block';
  document.getElementById('errorSection').style.display = 'none';
  document.getElementById('result').classList.remove('show');

  // 检查缓存
  var isRefresh = document.getElementById('chkRefresh') && document.getElementById('chkRefresh').checked;
  var cache = isRefresh ? null : _loadCache(year, month, day, hour, currentSex);

  // P60: 202轮询+断连重试（与ziwei.html一致: 外网链路~80s断连, single-flight算完后缓存HIT秒回）
  var _lnAttempt = 0;
  var _lnBody = JSON.stringify({year:+year, month:+month, day:+day, hour:+hour, sex:currentSex, refresh:!!isRefresh});
  var _loadingText = document.querySelector('#loading .loading-text') || document.querySelector('#loading');

  function _doLiunianFetch() {
    _lnAttempt++;
    return fetch('/api/ziwei', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-API-Key':'mingli-qiankun-v7'},
      body: _lnBody
    })
    .then(function(resp) {
      if (resp.status === 202) {
        if (_lnAttempt > 12) throw new Error('分析超时');
        if (_loadingText) _loadingText.textContent = '深度分析进行中（约1-2分钟），请稍候...';
        return new Promise(function(resolve) { setTimeout(resolve, 30000); }).then(_doLiunianFetch);
      }
      if (!resp.ok) {
        var errTitle = '分析超时', errMsg = 'AI 分析耗时过长，建议稍后重试或查看缓存结果';
        if (resp.status === 401) { errTitle = '服务认证失败'; errMsg = '密钥验证不通过，请刷新页面后重试'; }
        else if (resp.status === 500) { errTitle = '服务器错误'; errMsg = '服务器内部处理异常，请稍后重试'; }
        else if (resp.status === 504) { errTitle = '分析超时'; errMsg = 'AI 正在全力运算中，请稍后重试'; }
        document.getElementById('errorTitle').textContent = errTitle;
        document.getElementById('errorMsg').textContent = errMsg;
        throw new Error(errTitle);
      }
      return resp.json();
    }, function(netErr) {
      // 网络断开(链路idle超时): 服务端仍继续算完写缓存, 30s后重试即可HIT
      if (_lnAttempt > 12) throw netErr;
      if (_loadingText) _loadingText.textContent = '分析时间较长，自动重试中（服务端持续计算）...';
      return new Promise(function(resolve) { setTimeout(resolve, 30000); }).then(_doLiunianFetch);
    });
  }

  _doLiunianFetch()
  .then(function(data) {
    if (data.error) { alert(data.error); return; }
    currentResult = data;
    activeDetailIdx = -1;
    // 合并缓存（优先API新数据）
    _mergeCache(data, cache);
    // 保存新缓存
    _saveCache(year, month, day, hour, currentSex, data);
    renderResult(data);
    // 缓存分析结果，切页回来保持显示
    try {
      localStorage.setItem('mingli_ziwei_result', JSON.stringify({
        result: data,
        year: document.getElementById('year').value,
        month: document.getElementById('month').value,
        day: document.getElementById('day').value,
        hour: document.getElementById('hour').value,
        sex: currentSex
      }));
    } catch(e) {}
  })
  .catch(function(e) {
    document.getElementById('errorSection').style.display = 'block';
    document.getElementById('loading').classList.remove('show');
    btn.disabled = false;
  })
  .finally(function() {
    btn.disabled = false;
    document.getElementById('loading').classList.remove('show');
    document.getElementById('loadingStages').style.display = 'none';
  });
}

function renderResult(data) {

  // ---- 灾难预警 ----

  // ---- P57: 行动清单（每月具体行动建议） ----

  // ---- 大运时间线 ----
  var dayunList = data['大运'] || [];

  currentBirthYear = birthYear;  // P5: 同步到全局变量供筛选器使用
  var dayunHtml = '';
  var badgeMap = {'大吉':'badge-daji','中吉':'badge-zhongji','小吉':'badge-xiaoji','平运':'badge-pingyun','偏弱':'badge-pingyun','大凶':'badge-daxiong'};

    if (overallDesc) deepHtml += '<div class="deep-title">综合解读</div><div class="deep-text">' + overallDesc + '</div>';

    // P44: 只有综合解读不包含维度内容时，才显示维度分析（避免重复）
    if (!hasDimContent) {
      var llmDims = {'财富':'财富','事业':'事业','婚姻':'婚姻','子女':'子女','父母':'父母','健康':'健康'};
      var llmScore = dy['评分'] || {};
      for (var k in llmDims) {

    }

    var stateCls = '';
    if (isCurrent) stateCls = ' current';
    else if (dy['结束年龄'] < nowAge) stateCls = ' past';
    else stateCls = ' future';
    dayunHtml += '<div class="dayun-card' + stateCls + '" onclick="toggleDayunCard(this)">' +
      '<div class="dayun-header">' +
        '<div><span class="age-range">' + dy['起始年龄'] + '-' + dy['结束年龄'] + '岁</span> <span class="gz-info" style="color:var(--gold)">' + (dy['大运宫名']||(dy['天干']||'')+(dy['地支']||'')+'宫') + '</span></div>' +
        '<span class="dayun-badge ' + ratingCls + '">' + totalScore + ' ' + rating + '</span>' +
      '</div>' +
      '<div class="stars-line"><span class="star-label">主星</span>' + majorStr + (minorStr ? ' &nbsp;<span class="star-label">辅</span>' + minorStr : '') + '</div>' +
      '<div class="score-bars">' + barHtml + '</div>' +
      '<div class="dayun-deep">' + deepHtml + buildDayunLiunian(birthYear, dy['起始年龄'], dy['结束年龄']) + '</div>' +
      '<div class="expand-hint">▸ 点击展开深度解读 + 此运流年</div>' +

    var cur = document.querySelector('.dayun-card.current');
    if (cur) cur.classList.add('expanded');
  }, 50);

  document.getElementById('result').classList.add('show');
  setTimeout(function() {
    document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
}

// P5: 流年筛选器
function filterLiunian(mode, btn) {
  var cards = document.querySelectorAll('.dayun-card');
  var nowYear = new Date().getFullYear();
  var nowAge = nowYear - currentBirthYear;
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var ageText = card.querySelector('.age-range').textContent;
    var parts = ageText.split('-');
    var startAge = parseInt(parts[0]);
    var endAge = parseInt(parts[1]);
    var startYear = currentBirthYear + startAge;
    var endYear = currentBirthYear + endAge;
    var show = true;
    if (mode === 'future10') {
      show = (endYear >= nowYear && startYear <= nowYear + 10);
    } else if (mode === 'current') {
      show = (nowAge >= startAge && nowAge <= endAge);
    }
    card.style.display = show ? '' : 'none';
  }
  // 更新按钮状态
  var btns = document.querySelectorAll('.liunian-filter-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.remove('active');
  }
  btn.classList.add('active');
}

  if (!p) return;

  var sihuaMap = p['四化'] || {};
  var sihuaStr = '';
  var sihuaKeys = Object.keys(sihuaMap);
  for (var si = 0; si < sihuaKeys.length; si++) {
    if (sihuaStr) sihuaStr += ' · ';
    sihuaStr += sihuaKeys[si] + ': ' + sihuaMap[sihuaKeys[si]];
  }

  detailContainer.innerHTML =
    '<div class="palace-detail show">' +
      '<button class="close-btn" onclick="togglePalaceDetail(' + zhiIdx + ')">&times;</button>' +
      '<h4>' + p['宫名'] + '宫 ' + p['天干'] + p['地支'] + '</h4>' +
      '<p style="color:var(--text-dim);font-size:0.82em;margin-bottom:8px">' +
        '主星：' + ((p['主星']||[]).join('、') || '无') + ' &nbsp;|&nbsp; ' +
        '辅星：' + ((p['辅星']||[]).join('、') || '无') +
        (sihuaStr ? ' &nbsp;|&nbsp; ' + sihuaStr : '') +
      '</p>' +
      '<p style="color:var(--text-dim);font-size:0.78em;margin-bottom:10px">' +
        '大限：' + p['大限'] +
        (p['是否命宫'] ? ' · 命宫' : '') +
        (p['是否身宫'] ? ' · 身宫' : '') +
      '</p>' +
      '<div class="interpret">' + p['解读'] + '</div>' +
    '</div>';
  activeDetailIdx = zhiIdx;

  setTimeout(function() {
    detailContainer.scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement.tagName !== 'TEXTAREA') {
    doAnalyze();
  }
});

function buildDayunLiunian(birthYear, startAge, endAge) {
  var liunianList = (currentResult && currentResult['流年']) || [];
  if (liunianList.length === 0) return '';
  var startYear = birthYear + startAge;
  var endYear = birthYear + endAge;
  var filtered = [];
  for (var i = 0; i < liunianList.length; i++) {
    if (liunianList[i]['年份'] >= startYear && liunianList[i]['年份'] <= endYear) {
      filtered.push(liunianList[i]);
    }
  }
  if (filtered.length === 0) return '';
  var nowYear = new Date().getFullYear();
  var dimCfg = [
    {key:'事业', color:'#3498db'},{key:'财富', color:'#2ecc71'},
    {key:'婚姻', color:'#e74c3c'},{key:'子女', color:'#9b59b6'},
    {key:'健康', color:'#f39c12'}
  ];
  var html = '<div class="ln-section-title">此运流年（' + startYear + '—' + endYear + '）</div>';
  html += '<div class="ln-card-grid">';
  
  for (var i = 0; i < filtered.length; i++) {
    var ln = filtered[i];
    var isNow = (ln['年份'] === nowYear);
    var sc = ln['评分']||50;
    var scColor = sc >= 65 ? '#2ecc71' : sc >= 45 ? '#d4a844' : '#e74c3c';
    var hasDetail = (ln['简评详情'] && ln['简评详情'].length > 5) || (ln['逐月'] && ln['逐月'].length > 0);
    var cardId = 'ln-card-' + ln['年份'];
    
    // 卡片头：年份 + 干支 + 评分
    html += '<div class="ln-card' + (isNow ? ' ln-now-card' : '') + '" onclick="toggleLnDetail(\'' + cardId + '\')">';
    html += '<div class="ln-card-header">';
    html += '<span class="ln-card-year">' + ln['年份'] + (isNow ? ' ▸' : '') + '</span>';
    html += '<span class="ln-card-gz">' + (ln['流年干支']||'') + '</span>';
    html += '<span class="ln-card-score" style="color:' + scColor + '">' + sc + '</span>';
    html += '</div>';
    
    // 四化标签 (P2新增)
    var sihuaTags = ln['四化'] || null;
    if (sihuaTags) {
      var sihuaHtml = '<div class="ln-sihua-row">';
      var sihuaMap = {'化禄':'#2ecc71','化权':'#3498db','化科':'#c9a84c','化忌':'#e74c3c'};
      for (var sk in sihuaMap) {
        if (sihuaTags[sk]) {
          sihuaHtml += '<span class="ln-sihua-badge" style="background:' + sihuaMap[sk] + '1a;color:' + sihuaMap[sk] + '">' + sk[1] + ' ' + sihuaTags[sk] + '</span>';
        }
      }
      sihuaHtml += '</div>';
      html += sihuaHtml;
    }
    
    // 5 维 mini bar
    html += '<div class="ln-card-dims">';
    for (var di = 0; di < dimCfg.length; di++) {
      var dv = ln[dimCfg[di].key + '分'] || ln[dimCfg[di].key] || 50;
      if (typeof dv === 'string') dv = parseInt(dv) || 50;
      if (dv > 100) dv = 100;
      var w = dv;
      var barClr = dv >= 65 ? 'rgba(46,204,113,0.9)' : dv >= 45 ? 'rgba(212,168,68,0.9)' : 'rgba(231,76,60,0.9)';
      html += '<div class="ln-dim-item">' +
        '<span class="ln-dim-label">' + dimCfg[di].key + '</span>' +
        '<span class="ln-dim-bar"><span class="ln-dim-fill" style="width:' + w + '%;background:' + barClr + '"></span></span>' +
        '<span class="ln-dim-val">' + dv + '</span>' +
      '</div>';
    }
    html += '</div>';
    
    // 简评
    var brief = ln['简评'] || '';
    if (brief) {
      html += '<div class="ln-card-brief">' + escapeHtml(brief) + '</div>';
    }

    // P9: 详批按钮
    if (hasDetail) {
      html += '<div style="text-align:center;margin-top:6px"><button class="liunian-filter-btn" style="font-size:0.72em;padding:4px 14px" onclick="event.stopPropagation();openLnModal(' + ln['年份'] + ')">📖 详批</button></div>';
    }

    // 可折叠详情区
    if (hasDetail) {
      html += '<div class="ln-card-detail" id="' + cardId + '" style="display:none">';
      
      // 简评详情
      var detail = ln['简评详情'] || '';
      if (detail) {
        html += '<div class=\"ln-detail-section-title\">📖 年度详析</div>';
        html += '<div class=\"ln-detail-text\">' + escapeHtml(detail) + '</div>';
      }
      
      // 逐月面板 (P6: 默认显示6个月，点击展开12个月)
      var months = ln['逐月'] || [];
      if (months.length > 0) {
        var monthColors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6',
                          '#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#1abc9c'];
        var showCount = 6;
        var monthId = 'months-' + ln['年份'];
        html += '<div class="ln-monthly-grid" id="' + monthId + '">';
        for (var mi = 0; mi < months.length; mi++) {
          var m = months[mi];
          if (!m || !(m.trim())) continue;
          var col = monthColors[mi % monthColors.length];
          var sep = m.indexOf('：') > -1 ? '：' : (m.indexOf(':') > -1 ? ':' : null);
          var parts = sep ? m.split(sep) : [m];
          var label = (parts[0] || ('月' + (mi + 1))).trim();
          var mdetail = (parts.slice(1).join(sep || '')).trim();
          var hideCls = mi >= showCount ? ' ln-month-hidden' : '';
          html += '<div class="ln-month-card' + hideCls + '" style="border-top-color:' + col + '">' +
            '<div class="ln-month-label" style="color:' + col + '">' + escapeHtml(label) + '</div>' +
            '<div class="ln-month-detail">' + escapeHtml(mdetail) + '</div>' +
          '</div>';
        }
        html += '</div>';
        if (months.length > showCount) {
          html += '<div class="ln-month-toggle" onclick="toggleMonths(\'' + monthId + '\', this)">▼ 展开' + months.length + '个月</div>';
        }
      }
      
      html += '<div class="ln-expand-hint">▲ 点击收起</div>';
      html += '</div>'; // end detail
      
      html += '<div class="ln-expand-hint">▼ 点击展开详情与流月</div>';
    }
    
    html += '</div>'; // end card
  }
  
  html += '</div>'; // end grid
  return html;
}

// 折叠切换
function toggleLnDetail(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var card = el.parentElement;  // .ln-card
  var isOpen = el.style.display === 'block';
  el.style.display = isOpen ? 'none' : 'block';
  // 更新展开/收起提示
  var hints = card.querySelectorAll('.ln-expand-hint');
  if (hints.length >= 2) {
    hints[0].style.display = isOpen ? 'block' : 'none';   // "点击展开"
    hints[1].style.display = isOpen ? 'none' : 'block';  // (inside detail) "点击收起"
  }
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// P6: 流月展开/收起
function toggleMonths(id, btn) {
  var grid = document.getElementById(id);
  if (!grid) return;
  var hidden = grid.querySelectorAll('.ln-month-hidden');
  var isOpen = hidden.length === 0;
  if (isOpen) {
    // 收起: 隐藏后6个月
    var cards = grid.querySelectorAll('.ln-month-card');
    for (var i = 6; i < cards.length; i++) {
      cards[i].classList.add('ln-month-hidden');
    }
    btn.textContent = '▼ 展开12个月';
  } else {
    // 展开: 显示全部
    for (var i = 0; i < hidden.length; i++) {
      hidden[i].classList.remove('ln-month-hidden');
    }
    btn.textContent = '▲ 收起';
  }
}

// 大运卡片展开互斥 — 同时只能展开一张
function toggleDayunCard(card) {
  var wasExpanded = card.classList.contains('expanded');
  // 先收起所有
  document.querySelectorAll('.dayun-card.expanded').forEach(function(c) { c.classList.remove('expanded'); });
  // 再展开当前(如原来没展开)
  if (!wasExpanded) card.classList.add('expanded');
}

// 简评浮窗：hover/click 展示详情
(function() {
  var tip = document.createElement('div');
  tip.id = 'brief-tooltip';
    tip.style.cssText = 'display:none;position:fixed;z-index:9999;max-width:320px;padding:12px 16px;background:var(--bg-card);border:2px solid var(--gold);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,0.35);font-size:0.84em;line-height:1.75;color:var(--text);pointer-events:none;';
    document.body.appendChild(tip);

  // 给 .ln-tip 加样式
  var s = document.createElement('style');
  s.textContent = '.ln-tip{cursor:pointer;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;text-decoration-style:dotted}.ln-tip:hover{color:var(--gold)}.refresh-label{font-size:0.75em;color:var(--text-dim);cursor:pointer;margin-left:12px;display:inline-flex;align-items:center;gap:4px;user-select:none}.refresh-label input{margin:0;accent-color:var(--gold)}';
  document.head.appendChild(s);

  var activeEl = null;
  function show(e) {
    var txt = this.getAttribute('data-tip');
    if (!txt) return;
    tip.textContent = txt;
    tip.style.display = 'block';
    var x = e.clientX + 16, y = e.clientY - 10;
    if (x + 330 > window.innerWidth) x = e.clientX - 330;
    if (y + 100 > window.innerHeight) y = window.innerHeight - 110;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
    activeEl = this;
  }
  function hide() { tip.style.display = 'none'; activeEl = null; }

  document.addEventListener('mouseover', function(e) {
    var el = e.target.closest('.ln-tip');
    if (el && el !== activeEl) show.call(el, e);
  });
  document.addEventListener('mouseout', function(e) {
    var el = e.target.closest('.ln-tip');
    if (el && el === activeEl && !el.contains(e.relatedTarget)) hide();
  });
  // 点击切换（移动端）
  document.addEventListener('click', function(e) {
    var el = e.target.closest('.ln-tip');
    if (!el) { hide(); return; }
    if (el === activeEl && tip.style.display === 'block') { hide(); return; }
    show.call(el, e); tip.style.pointerEvents = 'auto';
    setTimeout(function() { tip.style.pointerEvents = 'none'; }, 2000);
  });
})();

// P9: 流年详批弹窗
function openLnModal(year) {
  var ln = null;
  var liunians = (currentResult && currentResult['流年']) || [];
  for (var i = 0; i < liunians.length; i++) {
    if (liunians[i]['年份'] === year) { ln = liunians[i]; break; }
  }
  if (!ln) return;

  var modal = document.getElementById('lnModal');
  var body = document.getElementById('lnModalBody');
  var title = document.getElementById('lnModalTitle');

  var sc = ln['评分'] || 50;
  var scColor = sc >= 65 ? '#2ecc71' : sc >= 45 ? '#d4a844' : '#e74c3c';
  title.innerHTML = ln['年份'] + '年 ' + (ln['流年干支']||'') + ' <span style="color:' + scColor + ';font-size:0.8em">' + sc + '分</span>';

  var html = '';
  // 四化
  var sihua = ln['四化'] || {};
  if (Object.keys(sihua).length > 0) {
    html += '<div style="margin-bottom:12px"><div style="font-size:0.82em;color:var(--gold);margin-bottom:6px">四化</div>';
    var sihuaMap = {'化禄':'#2ecc71','化权':'#3498db','化科':'#c9a84c','化忌':'#e74c3c'};
    for (var sk in sihua) {
      html += '<span style="display:inline-block;padding:3px 10px;margin:2px;border-radius:4px;background:' + sihuaMap[sk] + '1a;color:' + sihuaMap[sk] + ';font-size:0.78em">' + sk + '·' + sihua[sk] + '</span>';
    }
    html += '</div>';
  }
  // 5维
  var dims = {'事业':'#3498db','财富':'#2ecc71','婚姻':'#e74c3c','子女':'#9b59b6','健康':'#f39c12'};
  html += '<div style="margin-bottom:12px"><div style="font-size:0.82em;color:var(--gold);margin-bottom:6px">五维评分</div>';
  for (var dk in dims) {
    var dv = ln[dk+'分'] || ln[dk] || 50;
    html += '<div style="display:flex;align-items:center;margin-bottom:4px;font-size:0.78em"><span style="min-width:36px;color:var(--text-dim)">' + dk + '</span><div style="flex:1;height:6px;background:rgba(42,53,80,0.3);border-radius:3px;margin:0 8px"><div style="height:100%;width:' + dv + '%;background:' + dims[dk] + ';border-radius:3px"></div></div><span style="min-width:24px;text-align:right;color:' + dims[dk] + '">' + dv + '</span></div>';
  }
  html += '</div>';
  // 简评
  if (ln['简评']) {
    html += '<div style="margin-bottom:12px"><div style="font-size:0.82em;color:var(--gold);margin-bottom:6px">简评</div><div style="font-size:0.85em;line-height:1.7;color:var(--text)">' + escapeHtml(ln['简评']) + '</div></div>';
  }
  // 年度详析
  if (ln['简评详情']) {
    html += '<div style="margin-bottom:12px"><div style="font-size:0.82em;color:var(--gold);margin-bottom:6px">年度详析</div><div style="font-size:0.82em;line-height:1.75;color:var(--text-dim);white-space:pre-wrap">' + escapeHtml(ln['简评详情']) + '</div></div>';
  }
  // 流月
  var months = ln['逐月'] || [];
  if (months.length > 0) {
    html += '<div><div style="font-size:0.82em;color:var(--gold);margin-bottom:6px">流月</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">';
    var monthColors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#1abc9c'];
    for (var mi = 0; mi < months.length; mi++) {
      var m = months[mi];
      if (!m || !m.trim()) continue;
      var col = monthColors[mi % monthColors.length];
      var sep = m.indexOf('：') > -1 ? '：' : (m.indexOf(':') > -1 ? ':' : null);
      var parts = sep ? m.split(sep) : [m];
      html += '<div style="background:var(--bg-card2);border-radius:5px;padding:5px 7px;border-top:3px solid ' + col + '"><div style="font-size:0.68em;font-weight:bold;color:' + col + '">' + escapeHtml((parts[0]||'').trim()) + '</div><div style="font-size:0.72em;color:var(--text);line-height:1.4">' + escapeHtml((parts.slice(1).join(sep||'')).trim()) + '</div></div>';
    }
    html += '</div></div>';
  }
  body.innerHTML = html;
  modal.style.display = 'flex';
}

function closeLnModal() {
  document.getElementById('lnModal').style.display = 'none';
}
</script>
